<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smoke Bomb Effect</title>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{ background:#05081a; display:flex; align-items:center; justify-content:center; min-height:100vh; }

    /* ===== the smoke band ===== */
    .smokeband{
      position:relative;
      width:100%;
      height:140px;                 /* visible band height — change freely */
      background:radial-gradient(120% 200% at 50% 100%, #0c1530 0%, #070b1e 60%, #05081a 100%);
      overflow:hidden;
    }
    /* soft inner vignette to seat the smoke in the band */
    .smokeband::before{
      content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
      box-shadow:inset 0 0 70px 14px rgba(5,8,26,.6);
    }
    .smokeband canvas{
      position:absolute; left:0; top:0; width:100%; display:block; z-index:1;
    }
  </style>
</head>
<body>

  <!-- Drop this block anywhere. Set the band height in CSS; the canvas auto-sizes. -->
  <section class="smokeband" id="smokeband">
    <canvas id="smokeCanvas"></canvas>
  </section>

  <script>
  (function(){
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cv = document.getElementById('smokeCanvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    let W = 0, H = 0;
    const DPR = Math.min(devicePixelRatio || 1, 2);

    function resize(){
      const wrap = cv.parentElement;
      W = wrap.clientWidth;
      H = wrap.clientHeight * 2.6;          // canvas taller than the band → smoke rises & fades out the top
      cv.width  = Math.max(1, W * DPR);
      cv.height = Math.max(1, H * DPR);
      cv.style.width  = W + 'px';
      cv.style.height = H + 'px';
      cv.style.top    = (-H * 0.55) + 'px'; // pull up so the dense smoke sits in the visible band
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    let t = 0;
    const particles = [];

    // mixed red + blue streams crossing from both sides
    const streams = [
      { col:[59,130,246],  dir: 1, yFrac:0.70, amp:40, freq:0.009, phase:0   },
      { col:[220,38,38],   dir:-1, yFrac:0.85, amp:40, freq:0.011, phase:1.5 },
      { col:[120,170,255], dir: 1, yFrac:0.78, amp:30, freq:0.008, phase:0.8 },
      { col:[255,90,90],   dir:-1, yFrac:0.60, amp:35, freq:0.010, phase:2.2 },
      { col:[30,100,220],  dir: 1, yFrac:0.55, amp:25, freq:0.012, phase:3.1 },
      { col:[200,30,30],   dir:-1, yFrac:0.92, amp:22, freq:0.009, phase:1.0 },
    ];

    function spawn(s, i){
      const x0 = s.dir === 1 ? -40 : W + 40;
      const y0 = s.yFrac * H + (Math.random() - 0.5) * 22;
      particles.push({
        x:x0, y:y0,
        vx: s.dir * (0.9 + Math.random() * 0.7),
        vy: (Math.random() - 0.5) * 0.35,
        life:1, decay:0.0035 + Math.random() * 0.002,
        size:14 + Math.random() * 18,
        col:s.col, phase:t + Math.random() * Math.PI * 2,
        amp:s.amp, freq:s.freq, idx:i
      });
    }

    function render(){
      ctx.clearRect(0, 0, W, H);
      for (let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        const a = p.life * 0.32;
        const [r,g,b] = p.col;
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        grd.addColorStop(0,   `rgba(${r},${g},${b},${a})`);
        grd.addColorStop(0.5, `rgba(${r},${g},${b},${a * 0.5})`);
        grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      }
    }

    let running = true;
    function frame(){
      if (!running) return;
      t += 0.016;
      streams.forEach((s, i) => {
        const cnt = particles.filter(p => p.idx === i).length;
        if (cnt < 20 && Math.random() < 0.5) spawn(s, i);
      });
      for (let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        const wave = Math.sin(p.phase + p.x * p.freq) * p.amp * 0.45;
        p.y += p.vy + wave * 0.018;
        p.x += p.vx;
        p.life -= p.decay;
        p.size += 0.15;
        if (p.life <= 0 || p.x < -120 || p.x > W + 120) particles.splice(i, 1);
      }
      render();
      requestAnimationFrame(frame);
    }

    if (reduce){
      // static haze for reduced-motion users
      for (let k = 0; k < 48; k++){
        const s = streams[k % streams.length];
        particles.push({ x:Math.random() * W, y:s.yFrac * H + (Math.random() - 0.5) * 30,
          life:0.8, size:26 + Math.random() * 26, col:s.col });
      }
      render();
    } else {
      // pause when scrolled off-screen
      const io = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting && !running){ running = true; requestAnimationFrame(frame); }
        else if (!e.isIntersecting){ running = false; }
      }), { threshold:0 });
      io.observe(cv.parentElement);
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
