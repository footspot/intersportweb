<!--SUBJECT: [Contact] {{subject}}-->
<!DOCTYPE html>
<html lang="fr">
<body style="margin:0;padding:24px;background:#f4f4f2;color:#1a1a1a;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.05)">
    <h1 style="font-size:20px;margin:0 0 4px;color:#164194">Intersport Club IDF</h1>
    <p style="margin:0 0 16px;color:#555;font-size:13px">Nouveau message via le formulaire de contact</p>

    <pre style="background:#eef2fb;border-left:4px solid #164194;padding:14px 16px;border-radius:6px;font-size:13px;white-space:pre-wrap;font-family:Menlo,Consolas,monospace">Nom : {{name}}
Email : {{email}}
Sujet : {{subject}}</pre>

    <p style="margin:18px 0 6px;font-weight:700;font-size:13px;color:#164194">Message</p>
    <div style="background:#fafafa;border:1px solid #eee;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap">{{message}}</div>

    <p style="margin:18px 0 0;color:#666;font-size:13px">
      Répondez directement à cet e-mail pour contacter {{name}}.
    </p>

    <p style="margin-top:24px;color:#888;font-size:12px">— Intersport Club IDF</p>
  </div>
</body>
</html>
