# * Supabase local project config — project_id matches the remote project ref.
# * Run `supabase link --project-ref hznvltijxkeadqpwctop` once, then `supabase db push`.
project_id = "hznvltijxkeadqpwctop"

# * systempay-ipn is a server-to-server webhook. It is authenticated by the
# * HMAC-SHA256 signature on the request body, not by a Supabase JWT — so
# * disable the gateway's JWT check or every IPN gets rejected with 401.
[functions.systempay-ipn]
verify_jwt = false

# * generate-colissimo-label is invoked internally (systempay-ipn, future
# * orders trigger, admin retry). It already auth-gates itself via
# * X-Internal-Call. The Supabase secret service-role key format
# * (`sb_secret_…`) is not a JWT, so the gateway's verify_jwt rejects it
# * with UNAUTHORIZED_INVALID_JWT_FORMAT — turn the gateway check off here.
[functions.generate-colissimo-label]
verify_jwt = false

# * colissimo-tracking-worker — same reason: cron + manual internal triggers.
[functions.colissimo-tracking-worker]
verify_jwt = false

# * lookup-club-by-id — Flow 1 callback from Footspot, HMAC-only. No Supabase JWT.
[functions.lookup-club-by-id]
verify_jwt = false

# * footspot-pairing-complete — activation callback from Footspot, HMAC-only.
[functions.footspot-pairing-complete]
verify_jwt = false

# * footspot-push-event — internal helper (orders trigger + retry worker).
# * Self-gated via X-Internal-Call; service-role key is not a JWT.
[functions.footspot-push-event]
verify_jwt = false

# * footspot-retry-worker — pg_cron every 5 min. Same internal-call gate.
[functions.footspot-retry-worker]
verify_jwt = false

# * Shop-personalization inbound endpoints — HMAC + per-club Bearer, no Supabase
# * JWT. Footspot calls these to push shop config / discounts / disconnect.
[functions.update-shop-config]
verify_jwt = false

[functions.update-product-discounts]
verify_jwt = false

[functions.footspot-disconnect]
verify_jwt = false

# * club-products / club-stats — Footspot reads the "Ma boutique" discount
# * editor list and the "Statistiques" tab through these. Same HMAC + per-club
# * Bearer pipeline, no Supabase JWT.
[functions.club-products]
verify_jwt = false

[functions.club-stats]
verify_jwt = false

# * --- Guest-facing checkout chain --------------------------------------------
# * Checkout is guest-only — there is no logged-in user, so the browser sends
# * the publishable key (`sb_publishable_…`) as the Authorization Bearer. That
# * key is NOT a JWT, so the gateway's verify_jwt rejects it with
# * UNAUTHORIZED_INVALID_JWT_FORMAT before the function runs. Every function
# * the storefront calls without a session must be listed here, or a redeploy
# * silently reverts it to the verify_jwt = true default and breaks checkout.
[functions.cart-validate]
verify_jwt = false

[functions.create-order]
verify_jwt = false

[functions.create-form-token]
verify_jwt = false

[functions.validate-payment-hash]
verify_jwt = false

[functions.validate-promo-code]
verify_jwt = false

[functions.validate-prepaid-code]
verify_jwt = false

[functions.footspot-validate-purchase-code]
verify_jwt = false

# * club-access — public storefront club-password gate. Guest, no Supabase JWT.
[functions.club-access]
verify_jwt = false

# * send-order-email / generate-invoice — invoked internally by other functions
# * (IPN, create-order) with the service-role key, which is not a JWT either.
[functions.send-order-email]
verify_jwt = false

[functions.generate-invoice]
verify_jwt = false
